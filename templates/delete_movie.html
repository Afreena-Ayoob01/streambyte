<!DOCTYPE html>
<html>

<head>
    <title>Delete Movie</title>
</head>

<body>

    <h1>Delete Movie</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ movie.title }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <br>

    <a href="{% url 'movie_detail' movie.id %}">
        Cancel
    </a>

</body>

</html>
