{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Movie | StreamByte</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

</head>


<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav>

        <a href="{% url 'home' %}" class="logo">
            StreamByte
        </a>

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'add_movie' %}">
            Add New Movie
        </a>

        <a href="{% url 'favorites' %}">
            ♡ My Favorites
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </nav>


    <!-- =========================
         ADD MOVIE SECTION
    ========================== -->

    <main>

        <section class="add-movie-section">

            <h1>
                Add a New Movie
            </h1>

            <p>
                Welcome, {{ user.first_name }}!
            </p>

            <p class="add-movie-subtitle">
                Share a movie with the StreamByte community.
            </p>


            <form
                method="POST"
                enctype="multipart/form-data"
                class="add-movie-form"
            >

                {% csrf_token %}

                {{ form.as_p }}


                <button type="submit">
                    🎬 Add Movie
                </button>

            </form>


            <a
                href="{% url 'home' %}"
                class="add-movie-back"
            >
                ← Back to Home
            </a>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 StreamByte. All rights reserved.
        </p>

    </footer>


</body>

</html>
