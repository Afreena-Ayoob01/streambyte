{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Comment | StreamByte</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

</head>


<body>


    <!-- Navigation -->

    <nav>

        <a href="{% url 'home' %}" class="logo">
            StreamByte
        </a>

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'favorites' %}">
            ❤️ My Favorites
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </nav>


    <!-- Delete Confirmation -->

    <main>

        <div class="delete-comment-box">

            <h1>
                Delete Comment?
            </h1>

            <p>
                Are you sure you want to delete your comment?
            </p>

            <div class="comment-preview">

                <p>
                    "{{ comment.text }}"
                </p>

            </div>


            <form method="POST">

                {% csrf_token %}

                <div class="delete-comment-buttons">

                    <button type="submit">
                        Yes, Delete
                    </button>

                    <a
                        href="{% url 'movie_detail' comment.movie.id %}"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 StreamByte. All rights reserved.
        </p>

    </footer>


</body>

</html>
