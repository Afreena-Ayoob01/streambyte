{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | StreamByte</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

</head>


<body class="auth-page">

    <div class="auth-container">

        <!-- Logo -->

        <a href="{% url 'login' %}" class="login-logo"
            StreamByte
        </a>


        <!-- Login Box -->

        <div class="auth-box">

            <h1>
                Welcome 
            </h1>

            <p class="auth-subtitle">
                Sign in to continue to StreamByte
            </p>


            <!-- Error Message -->

            {% if error %}

                <div class="login-error">
                    {{ error }}
                </div>

            {% endif %}


            <!-- Login Form -->

            <form method="POST" class="auth-form">

                {% csrf_token %}


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit"
                        class="auth-button">

                    Login

                </button>

            </form>


            <!-- Register -->

            <p class="auth-footer">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Create an account
                </a>

            </p>


        </div>

    </div>


</body>

</html>
