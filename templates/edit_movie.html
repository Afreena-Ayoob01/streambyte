<!DOCTYPE html>
<html>

<head>
    <title>Edit Movie</title>
</head>

<body>

    <h1>Edit Movie</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{% url 'movie_detail' movie.id %}">
        Cancel
    </a>

</body>

</html>
