<!DOCTYPE html>
<html>

<head>
    <title>Add Movie - StreamByte</title>
</head>

<body>

    <h1>Add a New Movie</h1>

    <p>Welcome, {{ user.first_name }}!</p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Add Movie
        </button>

    </form>

    <br>

    <a href="{% url 'home' %}">
        Back to Home
    </a>

</body>

</html>
