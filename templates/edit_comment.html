{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Comment | StreamByte</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

</head>


<body>


    <!-- Navigation -->

    <nav>

        <a href="{% url 'home' %}" class="logo">
            StreamByte
        </a>

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'favorites' %}">
            ❤️ My Favorites
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </nav>


    <!-- Edit Comment -->

    <main>

        <div class="edit-comment-box">

            <h1>
                Edit Your Comment
            </h1>

            <p>
                Update your review for
                <strong>{{ comment.movie.title }}</strong>
            </p>


            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}


                <div class="edit-comment-buttons">

                    <button type="submit">
                        Save Changes
                    </button>

                    <a
                        href="{% url 'movie_detail' comment.movie.id %}"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 StreamByte. All rights reserved.
        </p>

    </footer>


</body>

</html>
